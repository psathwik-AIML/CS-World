<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Literal</title>
</head>
<body>
    <h1>Template Literal</h1>
    <p>by using template literal we can include variables inside strings</p>
</body>
<script>
    let name="peter"
    console.log(`Hello ${name}`)
    let a=3
    let b=6
    console.log(`sum of a and b is ${a+b}`)
</script>
</html>
