<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
    <h1>Conditional Statements</h1>
    <p>to manage flow of code we use conditional statements </p>
    <ul>
        <li>if is first executed</li>
        <li>else if is used to  execute multiple statements</li>
        <li>else is final </li>
    </ul>
    <p>switch statements also used but we use in cases </p>
</body>
<script>
    let a=3
    let b=7
    if(a>b){
        console.log("yes ")
    }
    else if(a==b){
        console.log("equal")
    }
    else{
        console.log("no")
    }

    let day=3
    // switch 
    switch(day){
        case 1:
            console.log("iam monday")
            break;
        case 2:
            console.log("iam tuesday")
            break;
        case 3:
            console.log("iam wednesday")
            break;
        case 4:
            console.log("iam thursday")
            break;
        case 5:
            console.log("iam friday")
            break;
        case 6:
            console.log("iam saturday")
            break;
        default:
            console.log("iam sunday")
    }
</script>
</html>
