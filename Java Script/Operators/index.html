<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>Operators</title>
    <style>
        h1{
            text-align:center;
        }
        img{
            width:300px;
        }
        </style>
</head>
<body>
    <h1>Operators</h1>
    <p>there are many operators in programming</p>
    <hr>
    <h3>Arithmetic Operators</h3>
    <img src="./arithmatic-operators.png" alt="arithmatic">
    <h3>Comparision Operators</h3>
    <img src="./comarision-operators.png" alt="comparision">
    <h3>Assignment Operators</h3>
    <img src="./assignment-operators.png" alt="assignment">
    <h3>Logical Operators</h3>
    <img src="./logical-operators.png" alt="logical">
    <h3>Bitwise Operators</h3>
    <img src="./bitwise-operators.png" alt="bitwise">
</body>
<script>
    let a=3
    let b=5
    // arithmetic  operators 
    console.log(`a+b=${a+b}`)
    console.log(`a-b=${a-b}`)
    console.log(`a*b=${a*b}`)
    console.log(`a/b=${a/b}`)
    console.log(`a%b=${a%b}`)
    console.log(`-(a)= -${a}`)
    console.log("..................")
    // comparision operators 
    console.log(a==b)
    console.log(a!=b)
    console.log(a>b)
    console.log(a>=b)
    console.log(a<b)
    console.log(a<=b)
    console.log("..................")
    // assignment operators 
    console.log(a+=3)
    console.log(a-=10)
    console.log(b*=10)
    console.log(a/=2)
    // logical operators 
    console.log("..................")
    let x=true
    let y=false
    console.log(x&&y)
    console.log(x||y)
    console.log(!y)
</script>
</html>
