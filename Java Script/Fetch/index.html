<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
</head>
<body>
    <h1>Fetch</h1>
    <p>fetch is used to exchnage data b/w browser and remote server</p>
    <p>same as ajax xml-http-request</p>
    <!-- js code  -->
     <script>
        // get 
        let req=fetch("https://jsonplaceholder.typicode.com/users")
        req.then((response)=>response.json()
        ).then((result)=>console.log(result)
        )
        // post 
        let p=fetch("https://jsonplaceholder.typicode.com/users",{
            method:"POST",
            body:JSON.stringify({
                name:"coder",
                age:20,
                city:"hyd"
            }),
            headers:{"Content-type":"application/json"}
        })
        p.then((res)=>res.json()
        ).then((output)=>console.log(output)
        )

     </script>
</body>
</html>
