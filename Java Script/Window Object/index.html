<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Object</title>
    <style>
        h1{
            text-align:center;
        }
        .p{
            color:purple;
        }
    </style>
</head>
<body>
    <h1>Window Object</h1>
    <p>it is a inbuilt object browser created for every webpage</p>
    <p class="p">open console to see output</p>
    <!-- js code  -->
     <script>
        console.log(window)
        // properties 

        // document
        // total webpage 
        console.info("document:")
        console.log(window.document)
        // inner width
        // the webpage width only
        console.info("inner width:")
        console.log(window.innerWidth)
        // inner height
        // the webpage height only
        console.info("inner height:")
        console.log(window.innerHeight)
        // outer width
        // the total window width
        console.info("outer width:")
        console.log(window.outerWidth)
        // outer height
        // the total window height
        console.info("outer height:")
        console.log(window.outerHeight)
     </script>
</body>
</html>
