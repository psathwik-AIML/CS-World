<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object</title>
    <style>
        h1 {
            text-align: center;
        }
        .p{
            color:purple;
        }
    </style>
</head>

<body>
    <h1>Date Object</h1>
    <p>it is a pre built object used for time and date related operations</p>
    <!-- js code  -->
    <p class="p">open console to see outputs</p>
    <script>
        let date = new Date()
        console.log(date);
        // methods 
        // format change 
        let d2=new Date("2003-03-31")
        console.log(d2)
        console.log(d2.getFullYear())
        // months start from 0 
        console.log(d2.getMonth())
        // days start from 0 
        console.log(d2.getDay())
        // change year 
        d2.setFullYear(2020)
        d2.setMonth(11)
        console.log(d2);
        
        // all at once 
        // 1 sec =1000 milli seconds 
        
        
    </script>
</body>

</html>
