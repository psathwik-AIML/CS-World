<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Back Function</title>
</head>
<body>
    <h1>Call Back Function</h1>
    <p>passing function as a argument inside function</p>
    <hr>
    <!-- js code  -->
     <script>
        function sample(test){
            test()
        }

        function a(){
            console.log("Hello World "); 
        }
        sample(a)
     </script>
</body>
</html>
