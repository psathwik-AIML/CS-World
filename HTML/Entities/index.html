<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entities</title>
</head>
<body>
    <h1>Entities</h1>
    <pre>
        normally we cannot use some codes as it is in text with out converting html 
        for that purpose we use entities 
        syntax : & (code/name) ;
    </pre>
    <h2>common entities</h2>
    <ul>
        <li>less than  &lt;</li>
        <li>greater than &gt;</li>
        <li>copy right &copy; </li>
        <li>rupee &#8377;</li>
    </ul>
</body>
</html>
