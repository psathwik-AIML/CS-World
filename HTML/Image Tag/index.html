<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <h1>Image Tag</h1>
    <p>Image tag is used to display our images in website</p>
    <p>src is a attribute we should give path </p>
    <p>src is a attribute we should give alternate name to display when image not loaded</p>
    
    <!-- external image  -->
     <h2>External Image</h2>
     <img src="https://plus.unsplash.com/premium_photo-1664303847960-586318f59035?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="car" width="300">
    <!-- local image  -->
     <h2>Local Image</h2>
     <img src="./cat.jpg" alt="car" width="300">
</body>
</html>
