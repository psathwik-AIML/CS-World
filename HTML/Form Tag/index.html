<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <h1>Form Tag</h1>
    <p>form tag is used to get info from client</p>
    <hr>
    <!-- form  -->
     <h2>Form</h2>
     <br>
     <form action="#" target="_blank">
        Name: <input type="text" name="name" required minlength="2" value="sathwik"  readonly>
        Password: <input type="password" name="pass">
        <br><br>
        Email: <input type="email">
        Number: <input type="number" max="10" min="2" step="4">
        Tel: <input type="tel">
        <br><br>
        <input type="button" value="button">
        <input type="submit" value="register">
        <input type="reset">
        <br><br><br>
        <!-- hidden  -->
        <input type="hidden">
        <input type="color">
        <br><br>
        <!-- radios  -->
        Male: <input type="radio" name="gender">
        Female: <input type="radio" name="gender">
        <!-- checkbox -->
         <br><br>
         Telugu: <input type="checkbox">
         Hindi: <input type="checkbox">
         English: <input type="checkbox">
         <br><br>
         <!-- date  -->
          <input type="date">
          <!-- search  -->
          <input type="search">
          <!-- file -->
          <input type="file">
          <!-- time  -->
           <input type="time">
           <!-- datetime-local  -->
           <input type="datetime-local">
           <br><br>
           <!-- week  -->
           <input type="week">
           <!-- url  -->
            <input type="url" name="url">
            <!-- month  -->
             <input type="month">
          <br><br>
          <!-- text area  -->
           <textarea cols="5" rows="10">code</textarea>
           <!-- select tag  -->
            <select name="select" id=""  size="10">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <br><br>
            <!-- field set tag  -->
             <fieldset >
                <legend>coders</legend>
                Name: <input type="text" placeholder="Enter Name">
                <br><br>
                Name: <input type="text" placeholder="Enter Name">
                <br><br>
                Name: <input type="text" placeholder="Enter Name">
             </fieldset>
     </form>
</body>
</html>
