<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataList Tag</title>
</head>
<body>
    <h1>DataList Tag</h1>
    <p>data list tag is used for input suggestions  to help client</p>
    <hr>
    <p>Favourite Fruit</p>
    <input type="text" list="fruits">


    <datalist id="fruits">
        <option value="banana"></option>
        <option value="mango"></option>
        <option value="watermelon"></option>
        <option value="orange"></option>
        <option value="grapes"></option>
        <option value="jamun"></option>
        <option value="apple"></option>
        <option value="guava"></option>
    </datalist>
</body>
</html>
