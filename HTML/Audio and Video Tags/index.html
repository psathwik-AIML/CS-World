<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Tags</title>
</head>
<body>
    <h1>Audio and Video Tags</h1>
    <p>audio and video tags are used to display audio and videos on website </p>
    <pre>
        muted is a attribute to play video in muted
        autoplay is attribute to play video on refresh
        loop is a attribute used to repeat
        poster is like thumbnail
    </pre>
    <hr>
    <h2>Audio Tag</h2>
    <audio controls  >
        <source src="./song.mp3">
    </audio>
    <h2>Audio Tag</h2>
    <video controls width="400" poster="../Image Tag/cat.jpg" >
        <source src="./video.mp4">
    </audio>
</body>
</html>
