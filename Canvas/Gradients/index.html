<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <!-- css code  -->
    <style>
        #board {
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <canvas id="board" width="600" height="400"></canvas>
    <!-- java script code  -->
    <script>
        let board = document.getElementById("board")
        let ctx = board.getContext("2d")
        let w = board.width;
        let h = board.height;
        // console.log(ctx);
        // fill color 
        ctx.fillStyle = "orange"
        // stroke color 
        ctx.strokeStyle = "lime"
        // width of line 
        ctx.lineWidth = 3

        // gradients 
        function drawGradients() {
            // linear gradient 
            const lg = ctx.createLinearGradient(10, 100, 300, 100)
            lg.addColorStop(0, "red")
            lg.addColorStop(0.5, "gold")
            lg.addColorStop(1, "blue")
            ctx.fillStyle = lg
            ctx.fillRect(10, 100, 300, 50)

            // radial gradient 
            const rg = ctx.createRadialGradient(200, 280, 10, 200, 280, 100)
            rg.addColorStop(0, "red")
            rg.addColorStop(1, "blue")
            ctx.fillStyle=rg
            ctx.arc(200,280,100,0,Math.PI*2)
            ctx.fill()
        }
        drawGradients()
    </script>
</body>

</html>
