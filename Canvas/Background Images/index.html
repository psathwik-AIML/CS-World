<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Images</title>
    <!-- css code  -->
    <style>
        #board {
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <canvas id="board" width="600" height="400"></canvas>
    <!-- java script code  -->
    <script>
        let board = document.getElementById("board")
        let ctx = board.getContext("2d")
        let w = board.width;
        let h = board.height;
        // console.log(ctx);
        // fill color 
        ctx.fillStyle = "orange"
        // stroke color 
        ctx.strokeStyle = "lime"
        // width of line 
        ctx.lineWidth = 3

        // background images 
         function drawBackgroundImages(){
            let image=new Image()
            image.src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRu-BjT_TFqioXpxyw7OI-hdTFGFqI0qbv8erPPuOxxnAGLS5Cu"

            image.onload=()=>{
                ctx.drawImage(image,0,0,w,h)
            }
        }

        drawBackgroundImages()
    </script>
</body>

</html>
