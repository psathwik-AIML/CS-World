<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle</title>
    <!-- css code  -->
    <style>
        #board {
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <canvas id="board" width="600" height="400"></canvas>
    <!-- java script code  -->
    <script>
        let board = document.getElementById("board")
        let ctx = board.getContext("2d")
        let w = board.width;
        let h = board.height;
        // console.log(ctx);
        // fill color 
        ctx.fillStyle = "orange"
        // stroke color 
        ctx.strokeStyle = "lime"
        // width of line 
        ctx.lineWidth = 3

               // lines 
        function drawLines() {
            ctx.beginPath()
            ctx.moveTo(10, 200)
            ctx.lineTo(80, 200)
            ctx.stroke()
        }

        drawLines()
    </script>
</body>

</html>
