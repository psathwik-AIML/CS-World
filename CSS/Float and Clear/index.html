<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        .parent{
            background-color:rgb(50, 88, 50);
            width:400px;
            height:300px;
            padding:10px;
        }
        .child1{
            background-color:rgb(205, 87, 87);
            width:70px;
            height:70px;
            margin-right:10px;
            float:left;
        }
        .child2{
            background-color:rgb(93, 87, 205);
            width:70px;
            height:70px;
            float:left;
            margin-right:10px;
        }
        .child3{
            background-color:rgb(203, 205, 87);
            color:red;
            width:70px;
            height:70px;
            float:left;

        }
    </style>
</head>
<body>
    <h1>Float</h1>
    <p>float is usef for layout purpose</p>
    <hr>
    <div class="parent">
        <div class="child1">child 1</div>
        <div class="child2">child 2</div>
        <div class="child3">child 3</div>
    </div>

    <p>clear is used to remove float</p>
</body>
</html>
