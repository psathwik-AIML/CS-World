<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow</title>
    <style>
        .box{
            background-color:skyblue;
            width:300px;
            height:300px;
            box-shadow:10px 10px 10px rgb(65, 207, 70);
        }
    </style>
</head>
<body>
    <h1>Box Shadow</h1>
    <p>shadow will get if we use this property</p>
    <p>min 2 values and max is 5 values</p>
    <pre>
        syntax:

                box-shadow:x-axis y-axis blur spread color
    </pre>
    <hr>
    <div class="box"></div>
</body>
</html>
