<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacent Sibling Selector</title>
    <style>
        h2+p{
            background-color:rgb(209, 103, 61);
        }
    </style>
</head>
<body>
    <h1>Adjacent Sibling Selector</h1>
    <pre>adjacent sibling selector target adjacent sibling only  </pre>

    example:
    <div>
        <h2>Iam Heading</h2>
        <p>iam paragraph 1</p>
        <p>iam paragraph 2</p>
        <p>iam paragraph 3</p>
        <p>iam paragraph 4</p>
        <p>iam paragraph 5</p>
    </div>
</body>
</html>
