<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Selector</title>
    <style>
        div > p{
            background-color:green;
        }
    </style>
</head>
<body>
    <h1>Child Selector</h1>
    <pre>child selector target direct children </pre>

    example:
    <div>
        <p>iam paragraph 1</p>
        <pre>
            <p>iam paragraph 2</p>
            <p>iam paragraph 3</p>
        </pre>
        <p>iam paragraph 4</p>
    </div>
</body>
</html>
