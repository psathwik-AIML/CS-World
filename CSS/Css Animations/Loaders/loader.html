<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loaders</title>
    <style>
        .container{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:100px;
        }
        .box1{
            width:200px;
            /* background-color:rgb(201, 59, 59); */
            display:flex;
            flex-wrap:wrap;
            align-items:center;
        }
        .box2{
            width:300px;
            display:flex;
            justify-content:space-evenly;
            align-items:center;
            /* background-color:rgb(134, 186, 74); */
        }
        .circle{
            width:32px;
            height:32px;
            border-radius:50%;
            background-color:rgb(40, 76, 161);
            margin:10px;
            opacity:0.4;
        }
        .circle:nth-child(1){
            animation:animate-circles 1.5s  infinite;
        }
        .circle:nth-child(2){
            animation:animate-circles 1.3s   infinite;
        }
        .circle:nth-child(3){
            animation:animate-circles 1.7s   infinite;
        }
        .circle:nth-child(4){
            animation:animate-circles 1.1s   infinite;
        }
        .circle:nth-child(5){
            animation:animate-circles 0.9s   infinite;
        }
        .circle:nth-child(6){
            animation:animate-circles 0.7s   infinite;
        }
        .circle:nth-child(7){
            animation:animate-circles 1.3s   infinite;
        }
        .circle:nth-child(8){
            animation:animate-circles 1.5s   infinite;
        }
        .circle:nth-child(9){
            animation:animate-circles 2s   infinite;
        }
        .line{
            width:9px;
            height:80px;
            background-color:orangered;
            border-radius:12px;
        }
        .line:nth-child(1){
            animation:animate-circles 0.7s 0.6s infinite;
        }
        .line:nth-child(2){
            animation:animate-circles 0.7s 0.3s  infinite;
        }
        .line:nth-child(3){
            animation:animate-circles 0.7s   infinite;
        }
        .line:nth-child(4){
            animation:animate-circles 0.7s  0.3s infinite;
        }
        .line:nth-child(5){
            animation:animate-circles 0.7s 0.6s  infinite;
        }
        @keyframes animate-circles{
            0%{
                transform:scale(1);
            }
            50%{
                opacity:1;
                transform:scale(1.5);
            }
            100%{
                opacity:0.4;
                transform:scale(1);
            }
        }
        @keyframes animate-lines{
            0%{
                height:80px;
            }
            50%{
                height:280px;
            }
            100%{
                height:80px;
            }
        }
    </style>
</head>
<body>
    <h1>Loaders</h1>
    <div class="container">
        <div class="box1">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        <div class="box2">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>
</body>
</html>
