<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Grid</title>
    <style>
        .container{
            border:2px solid blue;
            height:600px;
            display:grid;
            /* number of columns  */
            grid-template-columns:100px 200px 300px;
            /* number of rows  */
            grid-template-rows:200px 100px;
            /* gap b/w rows and columns  */
            gap:20px 10px;
            /* arrange items in horizontal  */
            justify-content:center;
            /* arrange items in vertical  */
            align-content:center;
        }
        .box{
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            border:2px solid red;
        }
        .box1{
            background-color:rgb(189, 77, 77);
        }
        .box2{
            background-color:rgb(82, 193, 124);
        }
        .box3{
            background-color:rgb(93, 84, 182);
        }
        .box4{
            background-color:rgb(184, 85, 174);
        }
        .box5{
            background-color:rgb(218, 204, 98);
        }
    </style>
</head>
<body>
    <h1>Normal Grid</h1>
    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
    </div>
</body>
</html>
