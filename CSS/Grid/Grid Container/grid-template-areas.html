<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Areas</title>
    <style>
        .container1{
            border:2px solid blue;
            height:600px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
        }
        .container2{
            border:2px solid blue;
            height:600px;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            grid-template-areas: "a a a"
                                 "b c c"
                                 "d d d"
                                 "e e e"
        }
        .box{
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            border:2px solid red;
        }
        .container1 .box1{
            background-color:rgb(189, 77, 77);
        }
        .container1 .box2{
            background-color:rgb(82, 193, 124);
        }
        .container1 .box3{
            background-color:rgb(93, 84, 182);
            
        }
        .container1 .box4{
            background-color:rgb(184, 85, 174);
            
        }
        .container1 .box5{
            background-color:rgb(218, 204, 98);
            
        }

        /* /////////// */
        .container2 .box1{
            background-color:rgb(189, 77, 77);
            grid-area:a;
        }
        .container2 .box2{
            background-color:rgb(82, 193, 124);
            grid-area:b;
        }
        .container2 .box3{
            background-color:rgb(93, 84, 182);
            grid-area:c;
            
        }
        .container2 .box4{
            background-color:rgb(184, 85, 174);
             grid-area:d;
            
        }
        .container2 .box5{
            background-color:rgb(218, 204, 98);
            grid-area:e;
            
        }
        .container2 .box6{
            background-color:rgb(18, 14, 77);
        }
        .container2 .box7{
            background-color:rgb(68, 150, 10);
        }
        .container2 .box8{
            background-color:rgb(179, 96, 34);
        }
        .container2 .box9{
            background-color:rgb(89, 22, 48);
        }
        
    </style>
</head>
<body>
    <h1>Grid Template Areas</h1>
    <hr>
    <!-- normal  -->
     <h2>normal grid</h2>
    <div class="container1">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
    </div>
    <hr>
    <!-- grid template areas -->
     <h2>grid template areas</h2>
    <div class="container2">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
        <!-- <div class="box box6">Box 6</div>
        <div class="box box7">Box 7</div>
        <div class="box box8">Box 8</div>
        <div class="box box9">Box 9</div> -->
    </div>
</body>
</html>
