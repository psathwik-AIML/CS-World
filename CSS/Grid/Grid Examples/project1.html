<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        .container1 {
            border: 2px solid blue;
            width: 700px;
            height: 500px;
            display: grid;
            grid-template-columns: 20% 60% 20%;
            grid-template-rows: 20% 60% 20%;
            grid-template-areas: "h h h"
                                 "n c a"
                                 "f f f";
            /* gap: 10px; */
        }

        .container2 {
            border: 2px solid blue;
            width: 700px;
            height: 500px;
            grid-template-columns: 20% 60% 20%;
            grid-template-rows: 20% 60% 20%;
            display: grid;
            /* gap: 10px; */
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .container1 .header {
            background-color: rgb(28, 73, 187);
            grid-area: h;
        }

        .container1 .navbar {
            background-color: rgb(57, 134, 188);
            grid-area: n;
        }

        .container1 .content {
            background-color: gray;
            grid-area: c;
        }

        .container1 .aside {
            background-color: rgb(59, 134, 188);
            grid-area: a;
        }

        .container1 .footer {
            background-color: rgb(28, 73, 187);
            grid-area: f;
        }


        /* 2nd code  */
        .container2 .header {
            background-color: rgb(28, 73, 187);
            grid-column:1/4 ;
        }

        .container2 .navbar {
            background-color: rgb(57, 134, 188);
        }

        .container2 .content {
            background-color: gray;
        }

        .container2 .aside {
            background-color: rgb(59, 134, 188);
        }

        .container2 .footer {
            background-color: rgb(28, 73, 187);
            grid-column:1/4 ;
        }
    </style>
</head>

<body>
    <h1>Project 1</h1>
    <hr>
    <!-- method 1  -->
    <h2>method 1
        <h2 />
        <div class="container1">
            <div class="box header">Header</div>
            <div class="box navbar">Navbar</div>
            <div class="box content">Content</div>
            <div class="box aside">Aside</div>
            <div class="box footer">Footer</div>
        </div>
        <hr>
        <hr>
        <br><br>
        <h2>method 2
            <h2 />
            <div class="container2">
                <div class="box header">Header</div>
                <div class="box navbar">Navbar</div>
                <div class="box content">Content</div>
                <div class="box aside">Aside</div>
                <div class="box footer">Footer</div>
            </div>
</body>

</html>
