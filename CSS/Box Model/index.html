<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            border:3px solid red;
            width:500px;
        }
        .box p{
            background:rgb(11, 92, 83);
        }
        .box2 p{
            padding:20px;
            margin:20px;
            border:8px solid rgb(151, 253, 27);
        }
    </style>
</head>
<body>
    <h1>Box Model</h1>
    <p>every element is inside a imaginary box</p>
    <p>box has padding,margin,border,content</p>
    <img src="./box-model.jpg" alt="box model image" width="300">
    <hr>
    <br><br>
    <!-- before  -->
     <h3>Before </h3>
     <div class="box box1">
         <p>Before Application</p>
        </div>
        <br><br>
        <!-- after -->
        <h3>After</h3>
    <div class="box box2">
        <p>After Application</p>
    </div>
</body>
</html>
