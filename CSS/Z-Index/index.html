<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Index</title>
    <style>
        .container{
            border:2px solid gold;
            width:500px;
            height:500px;
            margin:auto;
            padding:30px;
            position: relative;
        }
        .box{
            width:100px;
            height:100px;
            padding:10px;
        }
        .box-1{
            background-color:rgb(7, 57, 52);
            position: absolute;
            top:200px;
            left:300px;
            z-index:2;
        }
        .box-2{
            background-color:rgb(134, 94, 46);
            position: absolute;
            top:160px;
            left:310px;
            z-index:1;
        }
        .box-3{
            background-color:rgb(128, 28, 122);
            position: absolute;
            top:120px;
            left:320px;
            z-index:0;
        }
        .box-4{
            background-color:rgb(100, 27, 27);
            position: absolute;
            top:80px;
            left:330px;
            z-index:-1;
        }
    </style>
</head>
<body>
    <h1>Z Index</h1>
    <p>used for showing overlapping elements </p>
    <p>high z value have more priority</p>
    <hr>
    <div class="container">
        <div class="box box-1">Box 1</div>
        <div class="box box-2">Box 2</div>
        <div class="box box-3">Box 3</div>
        <div class="box box-4">Box 4</div>
    </div>
</body>
</html>
