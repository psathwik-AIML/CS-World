
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Shrink</title>
    <style>
          .parent{
            border:2px solid blue;
            width:500px;
            height:400px;
            display:flex;
        }
        .child{
            width:100px;
            height:100px;
        }
        .child-1{
            background-color:rgb(197, 42, 42);
        }
        .child-2{
            background-color:rgb(81, 171, 81);
        }
        .child-3{
            background-color:rgb(183, 176, 75);
        }
        .after .child-1{
            flex-shrink:2;
        }
        .after .child-2{
            flex-shrink:20;
        }
        .after .child-3{
            flex-shrink:30;
        }
    </style>
</head>
<body>
    <h1>Flex Shrink</h1>
    <p>we can decrease items size by help of this shrink property</p>
    <hr>
    <h2>Before Shrink</h2>
    <div class="before parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div>
    <hr>
    <h2>After Shrink</h2>
    <div class="after parent">
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
        <div class="child-1 child">child 1</div>
        <div class="child-2 child">child 2</div>
        <div class="child-3 child">child 3</div>
    </div>
</body>
</html>
