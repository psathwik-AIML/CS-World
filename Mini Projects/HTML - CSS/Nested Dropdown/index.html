<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Nested Dropdown</title>

    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/c845a0699c.js" crossorigin="anonymous"></script>
</head>
<body>

    <h1>Nested Dropdown</h1>

    <nav class="navbar">
        <ul class="menu">
            <li class="menu-li">Home</li>

            <li class="menu-li">
                Categories <i class="fa-solid fa-angle-down"></i>

                <ul class="sub-menu">
                    <li class="sub-menu-li">
                        Men <i class="fa-solid fa-angle-right"></i>

                        <ul class="sub-menu-menu">
                            <li>Shirts</li>
                            <li>Pants</li>
                        </ul>
                    </li>

                    <li class="sub-menu-li">
                        Women <i class="fa-solid fa-angle-right"></i>

                        <ul class="sub-menu-menu">
                            <li>Saree</li>
                            <li>Jewellery</li>
                        </ul>
                    </li>

                    <li class="sub-menu-li">
                        Kids <i class="fa-solid fa-angle-right"></i>

                        <ul class="sub-menu-menu">
                            <li>Toys</li>
                        </ul>
                    </li>
                </ul>
            </li>

            <li class="menu-li">About</li>
            <li class="menu-li">Contact</li>
        </ul>
    </nav>

</body>
</html>
