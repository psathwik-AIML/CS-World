<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .parent {
        border: 2px solid red;
        width: 200px;
        height: 300px;
        perspective: 1000px;
      }
      .box {
        width: 200px;
        height: 300px;
        background-color: skyblue;
        transform: rotateY(0deg);
        animation: animate 3s infinite linear;
      }
      @keyframes animate {
        to {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box"></div>
    </div>
  </body>
</html>
