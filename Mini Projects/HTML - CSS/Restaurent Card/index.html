<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Restaurent Cards</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Restaurent Cards</h1>
    <div class="restaurent-container">
        <!-- pizza  -->
        <div class="restaurent-card">
            <div class="restaurent-image">
                <img src="https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
            <div class="group">
                <p class="food-name">Pizza</p>
                <p class="food-rating">4.5 &#x2605;</p>
            </div>
            <div class="group">
                <p class="food-location">Hyderabad</p>
                <p class="food-price">&#x20b9; 400</p>
            </div>
        </div>
        <!-- biryani -->
         <div class="restaurent-card">
            <div class="restaurent-image">
                <img src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YmlyeWFuaXxlbnwwfHwwfHx8MA%3D%3D"
                    alt="">
            </div>
            <div class="group">
                <p class="food-name">Biryani</p>
                <p class="food-rating">3.5 &#x2605;</p>
            </div>
            <div class="group">
                <p class="food-location">Hyderabad</p>
                <p class="food-price">&#x20b9; 200</p>
            </div>
        </div>
        <!-- ice creme  -->
         <div class="restaurent-card">
            <div class="restaurent-image">
                <img src="https://images.unsplash.com/photo-1630301786766-70c27110f563?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8aWNlJTIwY3JlbWV8ZW58MHx8MHx8fDA%3D"
                    alt="">
            </div>
            <div class="group">
                <p class="food-name">Ice Creme</p>
                <p class="food-rating">4.5 &#x2605;</p>
            </div>
            <div class="group">
                <p class="food-location">Hyderabad</p>
                <p class="food-price">&#x20b9; 120</p>
            </div>
        </div>
        <!-- dosa  -->
         <div class="restaurent-card">
            <div class="restaurent-image">
                <img src="https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8RG9zYXxlbnwwfHwwfHx8MA%3D%3D"
                    alt="">
            </div>
            <div class="group">
                <p class="food-name">Dosa</p>
                <p class="food-rating">3.0 &#x2605;</p>
            </div>
            <div class="group">
                <p class="food-location">Chennai</p>
                <p class="food-price">&#x20b9;100</p>
            </div>
        </div>
    </div>
</body>

</html>
