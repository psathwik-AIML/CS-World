<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Invoice Table</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Invoice Table</h1>
    <table>
        <tr>
            <td colspan="2" class="bg"><b>Invoice #123</b></td>
            <td colspan="2">10 June 2026</td>
        </tr>
        <tr>
            <td colspan="2"><b>Pay to:</b><br>
                ABC Pvt Ltd <br>
                123 MG Road <br>
                Bengaluru,KA 560001</td>
            <td colspan="2"><b>Customer:</b> <br>
                John Doe <br>
                456 Park Street <br>
            Kolkata,WB 700016</td>
        </tr>
        <tr>
            <th class="bg">Item</th>
            <th class="bg">Qty.</th>
            <th class="bg">Unit Price</th>
            <th class="bg">Cost</th>
        </tr>
        <tr>
            <td>Pens</td>
            <td>100</td>
            <td>5.00</td>
            <td>500.00</td>
        </tr>
        <tr>
            <td>Calculators</td>
            <td>8</td>
            <td>100.00</td>
            <td>800.00</td>
        </tr>
        <tr>
            <td colspan="3" class="bg"><b>Subtotal</b></td>
            <td>1,300.00</td>
        </tr>
        <tr>
            <td colspan="2" class="bg"><b>Tax</b></td>
            <td>5%</td>
            <td>65.00</td>
        </tr>
        <tr>
            <td colspan="3" class="bg"><b>Grand Total</b></td>
            <td>1,365.00</td>
        </tr>
    </table>
</body>

</html>
